name: CI

on:
  push:
    branches: [xbox-on-upstream-*]
  pull_request:
    branches: [xbox-on-upstream-*]

jobs:
  windows-build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.4.304.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: true

      - name: Configure
        run: |
          cmake -S . -B _Build/ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build emulator + tests
        run: |
          cmake --build _Build/ci --target kyty_emulator launcher
          # Build test binaries (they are EXCLUDE_FROM_ALL)
          cmake --build _Build/ci --target scalar_provenance_tests build_flags_tests page_manager_tests archive_file_tests trophy_system_tests bit_array_tests lru_cache_tests common_tests ime_dialog_tests memory_tracker_tests shader_vertex_metadata_tests audio_out2_port_tests audio_out_timing_tests ngs2_sampler_tests ajm_resample_tests pad_haptics_tests controller_settings_tests host_input_tests save_data_memory_tests png_enc_tests jpeg_dec_tests jpeg_enc_tests ces_tests save_data_dialog_tests rtc_tests event_queue_lifetime_tests sync_on_address_tests image_page_table_tests psml_tests http_uri_parse_tests vdecsw_tests avplayer_file_tests virtual_memory_allocation_tests resource_materialization_tests resource_tracking_tests kernel_file_system_tests shader_cfg_tests shader_recompiler_compute_tests shader_recompiler_tessellation

      - name: Run tests (GPU-gated tests may fail on CI hardware)
        run: |
          ctest --test-dir _Build/ci --output-on-failure --timeout 300
        continue-on-error: true

      - name: Upload test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: _Build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore